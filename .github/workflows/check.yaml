name: check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: {}

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Ant needs a recent Go; the test matrix covers the older versions.
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: Test
        run: go run github.com/ant-src/ant/cmd/ant@v0.3.3 run .github/scripts/coverage.ant
